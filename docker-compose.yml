services:
  mysql:
    image: mysql:8.0
    container_name: campus-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_hub}
      MYSQL_USER: ${MYSQL_USER:-campushub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campushub123}
    ports:
      - "${MYSQL_PORT:-33066}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-campus_hub}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${MYSQL_USER:-campushub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-campushub123}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - campus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  campus-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
